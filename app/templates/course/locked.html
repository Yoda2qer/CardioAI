{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container narrow">
  <section class="state-card">
    <div class="state-icon">{{ icon("lock", 28) }}</div>
    <h1>{{ title }}</h1>
    <p>{{ reason }}</p>
    <a class="btn btn-primary" href="{{ progress.next_url }}">Перейти к текущему шагу {{ icon("arrow-right") }}</a>
    <a class="btn btn-ghost" href="/course">Вся программа</a>
  </section>
</div>
{% endblock %}
