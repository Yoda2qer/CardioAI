{# Иконки в виде встроенного SVG: наследуют цвет текста и не требуют внешних файлов. #}
{% macro icon(name, size=18) -%}
<svg class="icon icon-{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "check" -%}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "lock" -%}<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>
{%- elif name == "book" -%}<path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5z"/><path d="M4 20.5A2.5 2.5 0 006.5 23H20v-5"/>
{%- elif name == "code" -%}<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/>
{%- elif name == "clock" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "arrow-right" -%}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "arrow-left" -%}<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == "quiz" -%}<path d="M9 5H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-3"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M8.5 13l2.2 2.2L15.5 10.5"/>
{%- elif name == "award" -%}<circle cx="12" cy="9" r="6"/><path d="M8.5 14l-1.5 8 5-3 5 3-1.5-8"/>
{%- elif name == "play" -%}<path d="M7 4.5v15l12-7.5z"/>
{%- elif name == "user" -%}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>
{%- elif name == "users" -%}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.2a6.5 6.5 0 013.5 5.8"/>
{%- elif name == "x" -%}<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == "refresh" -%}<path d="M20 11a8 8 0 10-2.3 6M20 4v7h-7"/>
{%- elif name == "database" -%}<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
{%- elif name == "shield" -%}<path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9.5C7.2 20.3 4 16.5 4 12V6z"/>
{%- elif name == "key" -%}<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>
{%- elif name == "sun" -%}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == "moon" -%}<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>
{%- elif name == "print" -%}<path d="M7 9V3h10v6M7 18H5a2 2 0 01-2-2v-5a2 2 0 012-2h14a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="7" y="14" width="10" height="7"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro logo(size=30) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true">
  <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f55e6"/><stop offset="1" stop-color="#7a45e8"/></linearGradient></defs>
  <rect width="32" height="32" rx="9" fill="url(#logo-grad)"/>
  <path d="M5 17h5.5l2-5.5 3.5 10 2.8-7 1.2 2.5H27" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{%- endmacro %}
