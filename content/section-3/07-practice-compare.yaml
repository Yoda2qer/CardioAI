packages: [pandas, scikit-learn]
datasets: [heart_disease.csv]

statement: |
  Сравните три модели диагностики ИБС — логистическую регрессию, случайный лес и градиентный бустинг — так, как это принято делать: перекрёстной проверкой и по одной и той же метрике.

  Данные загружены. Функция `make_preprocess()` возвращает новый конвейер подготовки признаков; у каждой модели он должен быть свой.

  1. Создайте словарь `models` с тремя конвейерами `Pipeline([("prep", make_preprocess()), ("clf", ...)])`:
     - `"logreg"` — `LogisticRegression(max_iter=1000)`;
     - `"forest"` — `RandomForestClassifier(n_estimators=200, random_state=42)`;
     - `"boosting"` — `GradientBoostingClassifier(random_state=42)`.
  2. Оцените каждую модель функцией `cross_val_score` на всех данных `X`, `y` с `cv=cv` и `scoring="roc_auc"`. Сохраните **средние** значения по пяти частям в `auc_logreg`, `auc_forest`, `auc_boosting`.
  3. `best_model` — ключ словаря (строка) модели с наибольшим средним AUC.
  4. `spread_logreg` — стандартное отклонение пяти оценок AUC логистической регрессии (метод `.std()` массива оценок).
  5. Обучите случайный лес `models["forest"]` на обучающей выборке `X_train`, `y_train` и сохраните долю верных ответов на обучающей и тестовой выборках в `forest_train_acc` и `forest_test_acc`.

  Расчёт занимает до полуминуты: лес из 200 деревьев обучается шесть раз.

  ::: clinic Что обсудить после решения
  Сравните разницу между лучшей и худшей моделью со значением `spread_logreg`. Достаточно ли этих данных, чтобы уверенно назвать победителя? И какую из моделей вы предпочли бы объяснять коллегам на клинической конференции?
  :::

