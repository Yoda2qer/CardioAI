solution: |
  import numpy as np
  import pandas as pd
  from sklearn.compose import ColumnTransformer
  from sklearn.ensemble import GradientBoostingClassifier, RandomForestClassifier
  from sklearn.impute import SimpleImputer
  from sklearn.linear_model import LogisticRegression
  from sklearn.model_selection import StratifiedKFold, cross_val_score, train_test_split
  from sklearn.pipeline import Pipeline
  from sklearn.preprocessing import OneHotEncoder, StandardScaler

  hd = pd.read_csv("heart_disease.csv")
  hd[["chol", "trestbps"]] = hd[["chol", "trestbps"]].replace(0, np.nan)
  hd["target"] = (hd["num"] > 0).astype(int)

  numeric = ["age", "trestbps", "chol", "thalach", "oldpeak"]
  categorical = ["cp"]
  binary = ["sex", "exang"]
  X, y = hd[numeric + categorical + binary], hd["target"]

  def make_preprocess():
      return ColumnTransformer([
          ("num", Pipeline([("imputer", SimpleImputer(strategy="median")),
                            ("scaler", StandardScaler())]), numeric),
          ("cat", Pipeline([("imputer", SimpleImputer(strategy="most_frequent")),
                            ("onehot", OneHotEncoder(handle_unknown="ignore", sparse_output=False))]), categorical),
          ("bin", SimpleImputer(strategy="most_frequent"), binary),
      ])

  cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
  X_train, X_test, y_train, y_test = train_test_split(
      X, y, test_size=0.25, random_state=42, stratify=y
  )

  models = {
      "logreg": Pipeline([("prep", make_preprocess()), ("clf", LogisticRegression(max_iter=1000))]),
      "forest": Pipeline([("prep", make_preprocess()),
                          ("clf", RandomForestClassifier(n_estimators=200, random_state=42))]),
      "boosting": Pipeline([("prep", make_preprocess()), ("clf", GradientBoostingClassifier(random_state=42))]),
  }

  scores = {name: cross_val_score(model, X, y, cv=cv, scoring="roc_auc") for name, model in models.items()}
  auc_logreg = scores["logreg"].mean()
  auc_forest = scores["forest"].mean()
  auc_boosting = scores["boosting"].mean()

  best_model = max(scores, key=lambda name: scores[name].mean())
  spread_logreg = scores["logreg"].std()

  forest = models["forest"].fit(X_train, y_train)
  forest_train_acc = forest.score(X_train, y_train)
  forest_test_acc = forest.score(X_test, y_test)

  for name, values in scores.items():
      print(f"{name:9} {values.mean():.3f} ± {values.std():.3f}")
  print(best_model, forest_train_acc, forest_test_acc)

