solution: |
  import pandas as pd
  from sklearn.model_selection import train_test_split
  from sklearn.tree import DecisionTreeClassifier, export_text

  hf = pd.read_csv("heart_failure.csv")
  features = [c for c in hf.columns if c not in ("time", "DEATH_EVENT")]
  X, y = hf[features], hf["DEATH_EVENT"]

  patient = pd.DataFrame([{
      "age": 70, "anaemia": 0, "creatinine_phosphokinase": 300, "diabetes": 1,
      "ejection_fraction": 40, "high_blood_pressure": 1, "platelets": 250000,
      "serum_creatinine": 1.2, "serum_sodium": 137, "sex": 1, "smoking": 0,
  }])

  X_train, X_test, y_train, y_test = train_test_split(
      X, y, test_size=0.3, random_state=1, stratify=y
  )

  tree = DecisionTreeClassifier(max_depth=3, random_state=0).fit(X_train, y_train)
  train_acc = tree.score(X_train, y_train)
  test_acc = tree.score(X_test, y_test)

  root_feature = features[tree.tree_.feature[0]]
  root_threshold = tree.tree_.threshold[0]
  n_leaves = tree.get_n_leaves()

  deep_tree = DecisionTreeClassifier(random_state=0).fit(X_train, y_train)
  deep_train_acc = deep_tree.score(X_train, y_train)
  deep_test_acc = deep_tree.score(X_test, y_test)

  baseline_acc = 1 - y_test.mean()
  risk_patient = tree.predict_proba(patient)[0, 1]

  print(export_text(tree, feature_names=features))
  print(test_acc, deep_test_acc, baseline_acc)

