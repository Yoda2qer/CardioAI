packages: [pandas, scikit-learn]
datasets: [heart_failure.csv]

statement: |
  Постройте дерево решений, предсказывающее смерть пациента с сердечной недостаточностью, и убедитесь на собственных числах, как глубина дерева приводит к переобучению.

  Данные загружены. Признаки — все столбцы, кроме срока наблюдения `time` и исхода.

  1. Разделите данные: `train_test_split` с `test_size=0.3`, `random_state=1`, `stratify=y`. Сохраните результат в `X_train`, `X_test`, `y_train`, `y_test`.
  2. Обучите `tree` — `DecisionTreeClassifier(max_depth=3, random_state=0)`. Сохраните долю верных ответов на обучающей и тестовой выборках в `train_acc` и `test_acc`.
  3. Выясните, какой вопрос дерево задаёт первым:
     - `root_feature` — название признака в корне дерева;
     - `root_threshold` — порог для этого признака.

     Номер признака в корне хранится в `tree.tree_.feature[0]`, порог — в `tree.tree_.threshold[0]`.
  4. `n_leaves` — число листьев дерева (`get_n_leaves()`).
  5. Обучите `deep_tree` — такое же дерево без ограничения глубины (`random_state=0`). Сохраните `deep_train_acc` и `deep_test_acc`.
  6. `baseline_acc` — доля верных ответов на тестовой выборке, если каждому пациенту предсказывать «выживет».
  7. `risk_patient` — вероятность смерти, которую дерево `tree` даёт пациенту из таблицы `patient`.

  Напечатайте правила дерева функцией `export_text` и сравните три числа: `test_acc`, `deep_test_acc` и `baseline_acc`.

  ::: note Откуда у дерева вероятность
  Пациент попадает в один из листьев. Вероятность события — это доля умерших среди обучающих пациентов того же листа. Поэтому дерево выдаёт лишь столько разных значений вероятности, сколько у него листьев.
  :::

