packages: [pandas, scikit-learn]
datasets: [heart_disease.csv]

statement: |
  Постройте первую полноценную модель: логистическую регрессию, оценивающую вероятность ИБС у пациента, направленного на ангиографию.

  Данные загружены, разделены на обучающую и тестовую части, а конвейер подготовки признаков `preprocess` уже собран — он такой же, как в уроке о подготовке признаков.

  1. Создайте `model` — конвейер `Pipeline` из двух шагов: `("prep", preprocess)` и `("clf", LogisticRegression(max_iter=1000))`. Обучите его на обучающей выборке.
  2. `baseline_accuracy` — доля верных ответов на тестовой выборке у `DummyClassifier(strategy="most_frequent")`, обученного на обучающей выборке.
  3. `test_accuracy` — доля верных ответов вашей модели на тестовой выборке.
  4. `test_auc` — площадь под ROC-кривой на тестовой выборке (`roc_auc_score`). Ей нужны **вероятности** класса 1, а не готовые ответы. Подробно эту метрику разберём в следующем разделе; пока достаточно знать, что 0,5 — случайное угадывание, 1,0 — идеальное разделение.
  5. `or_male` — отношение шансов для мужского пола: экспонента коэффициента при признаке `sex`. Названия признаков после подготовки выдаёт `model.named_steps["prep"].get_feature_names_out()`, коэффициенты лежат в `model.named_steps["clf"].coef_[0]`.
  6. `prob_patient` — вероятность ИБС для пациента из таблицы `patient`.

  ::: clinic Вопрос для размышления
  Отношение шансов для мужского пола получится очень большим. Означает ли это, что мужской пол — причина ИБС? Вспомните, кого и по каким показаниям направляли на ангиографию в 1980-е годы.
  :::

