  - var: test_accuracy
    type: approx
    expected: 0.8043
    tol: 0.01
    label: Доля верных ответов модели
    hint: Используйте accuracy_score(y_test, model.predict(X_test)). Проверьте, что модель обучена на обучающей выборке, а LogisticRegression создана с max_iter=1000 и без других параметров.
  - var: test_auc
    type: approx
    expected: 0.8978
    tol: 0.01
    label: Площадь под ROC-кривой
    hint: В roc_auc_score передают вероятности — model.predict_proba(X_test)[:, 1], а не результат predict.
  - var: or_male
    type: approx
    expected: 4.25
    tol: 0.15
    label: Отношение шансов для мужского пола
    hint: Найдите позицию признака "bin__sex" в списке названий, возьмите коэффициент с тем же индексом и примените np.exp.
  - var: prob_patient
    type: approx
    expected: 0.957
    tol: 0.01
    label: Вероятность ИБС у пациента
    hint: model.predict_proba(patient) возвращает таблицу из одной строки и двух столбцов; нужен элемент [0, 1].
