questions:
  - text: "Разработчик сообщает, что модель выявляет заболевание с точностью 98%. Распространённость заболевания в обследуемой группе — 2%. Что нужно выяснить в первую очередь?"
    lesson: s3-l1
    options:
      - text: "Ничего: 98% — отличный результат"
      - text: "Чем модель лучше ответа «все здоровы», который тоже верен в 98% случаев"
        correct: true
      - text: "Сколько времени занимает один прогноз"
      - text: "На каком языке программирования написана модель"
    explanation: "Долю верных ответов всегда сравнивают с точкой отсчёта. При распространённости 2% ответ «все здоровы» даёт 98% верных ответов, не найдя ни одного больного."

  - text: "Какой признак указывает на переобучение модели?"
    lesson: s3-l1
    options:
      - text: "Качество одинаково низкое на обучающей и тестовой выборках"
      - text: "Качество на обучающей выборке высокое, а на тестовой заметно ниже"
        correct: true
      - text: "Качество на тестовой выборке выше, чем на обучающей"
      - text: "Модель обучается дольше одной минуты"
    explanation: "Переобученная модель запомнила особенности обучающих пациентов, поэтому на них работает отлично, а на новых — плохо. Одинаково низкое качество на обеих выборках говорит о недообучении."

  - text: "Какие обстоятельства повышают риск переобучения?"
    lesson: s3-l1
    options:
      - text: "Слишком гибкая модель"
        correct: true
      - text: "Малое число пациентов"
        correct: true
      - text: "Большое число признаков"
        correct: true
      - text: "Большая тестовая выборка"
    explanation: "Переобучению способствуют гибкость модели, недостаток данных и избыток признаков. Размер тестовой выборки влияет на точность оценки качества, но не на то, насколько модель подогнана к обучающим данным."

  - text: "Модель обучена на пациентах, которых направили на коронарную ангиографию; ИБС среди них подтверждена у 55%. Можно ли использовать её для скрининга всех посетителей поликлиники?"
    lesson: s3-l1
    options:
      - text: "Да: чем больше людей пройдёт через модель, тем лучше"
      - text: "Нет: в общей популяции болезнь встречается намного реже, и оценки модели будут завышены"
        correct: true
      - text: "Да, если сначала обезличить данные"
      - text: "Нет: модели нельзя применять к новым пациентам"
    explanation: "Модель применима к пациентам, похожим на обучающую выборку. Направленные на ангиографию — заранее отобранная группа с высокой вероятностью болезни; для неотобранных людей прогноз будет систематически завышен."

  - text: "В модели смертности при сердечной недостаточности отношение шансов для креатинина равно 1,88 (95% ДИ 1,38–2,57). Как это прочитать?"
    lesson: s3-l2
    options:
      - text: "Креатинин повышен у 88% умерших"
      - text: "При повышении креатинина на 1 мг/дл шансы смерти увеличиваются примерно в 1,9 раза при неизменных остальных признаках"
        correct: true
      - text: "Вероятность смерти при высоком креатинине равна 1,88"
      - text: "Снижение креатинина на 1 мг/дл уменьшит риск смерти в 1,9 раза"
    explanation: "Отношение шансов показывает, во сколько раз меняются шансы события при увеличении признака на единицу и неизменных прочих. Это мера связи, а не доказательство того, что вмешательство изменит исход."

  - text: "Для натрия сыворотки в той же модели отношение шансов 0,95 (95% ДИ 0,895–1,016). Какой вывод корректен?"
    lesson: s3-l2
    options:
      - text: "Натрий достоверно снижает риск смерти на 5%"
      - text: "Доверительный интервал включает 1: связь натрия с исходом при учёте других факторов не установлена"
        correct: true
      - text: "Натрий — самый сильный предиктор в модели"
      - text: "Модель построена неверно"
    explanation: "Отношение шансов, равное 1, означает отсутствие связи. Если интервал содержит единицу, данные совместимы и со снижением, и с повышением риска, поэтому утверждать связь нельзя."

  - text: "Отношение шансов смерти на один год возраста равно 1,053. Чему равно отношение шансов на десять лет?"
    lesson: s3-l2
    options:
      - text: "1,53 — прибавку 0,053 умножают на десять"
      - text: "Около 1,67 — отношение шансов возводят в десятую степень"
        correct: true
      - text: "10,53"
      - text: "1,053 — оно не зависит от интервала"
    explanation: "Отношения шансов перемножаются, а не складываются: за десять лет получается 1,053 в десятой степени, то есть примерно 1,67."

  - text: "В данных 96 неблагоприятных исходов. Сколько предикторов разумно включать в логистическую регрессию по практическому правилу?"
    lesson: s3-l2
    options:
      - text: "Около 9–10"
        correct: true
      - text: "Около 96"
      - text: "Не больше одного"
      - text: "Сколько угодно, если пациентов больше ста"
    explanation: "Ориентир — не менее десяти событий на один предиктор. Ограничивает именно число событий, а не общее число пациентов: 96 событий позволяют надёжно оценить около девяти-десяти коэффициентов."

  - text: "Почему методу ближайших соседей необходимо масштабирование признаков?"
    lesson: s3-l4
    options:
      - text: "Без него алгоритм не запускается"
      - text: "Иначе расстояние между пациентами определяется признаком с самыми большими числами"
        correct: true
      - text: "Масштабирование заполняет пропуски"
      - text: "Чтобы признаки стали категориальными"
    explanation: "kNN измеряет сходство расстоянием. Холестерин в сотнях единиц «заглушает» признаки, измеряемые единицами, если их не привести к общей шкале."

  - text: "Метод ближайших соседей при k = 1 даёт 100% верных ответов на обучающей выборке. Почему это не повод для радости?"
    lesson: s3-l4
    options:
      - text: "Каждый обучающий пациент — ближайший сосед самому себе: модель просто запомнила данные"
        correct: true
      - text: "Потому что k должно быть чётным"
      - text: "Потому что 100% означает ошибку в коде"
      - text: "Потому что обучающая выборка слишком велика"
    explanation: "При k = 1 прогноз для обучающего пациента берётся от него же самого. Это чистое запоминание; о качестве модели говорит только результат на пациентах, которых она не видела."

  - text: "Дерево без ограничения глубины даёт 100% верных ответов на обучающей выборке и 63% на тестовой; ответ «выживет» для каждого даёт 68%. Что это значит и что делать?"
    lesson: s3-l4
    options:
      - text: "Модель отличная, её можно внедрять"
      - text: "Дерево переобучено; его сложность нужно ограничить глубиной или минимальным размером листа"
        correct: true
      - text: "Данных слишком много, часть нужно удалить"
      - text: "Нужно увеличить глубину дерева ещё сильнее"
    explanation: "Идеальный результат на обучающей выборке при качестве хуже точки отсчёта на тестовой — классическое переобучение. Параметры `max_depth` и `min_samples_leaf` не дают дереву описывать отдельных пациентов."

  - text: "Какие утверждения о дереве решений верны?"
    lesson: s3-l4
    options:
      - text: "Ему не требуется масштабирование признаков"
        correct: true
      - text: "Оно само подбирает пороги для количественных признаков"
        correct: true
      - text: "Неглубокое дерево легко объяснить как набор правил"
        correct: true
      - text: "Его структура почти не меняется при небольшом изменении данных"
    explanation: "Дерево сравнивает значения с порогами, которые находит само, поэтому масштаб ему безразличен, а неглубокое дерево читается как правило. Но оно неустойчиво: небольшое изменение выборки может полностью перестроить дерево."

  - text: "Чем случайный лес принципиально отличается от градиентного бустинга?"
    lesson: s3-l6
    options:
      - text: "Лес строит деревья независимо и усредняет их, бустинг строит деревья последовательно, каждое исправляет ошибки предыдущих"
        correct: true
      - text: "Лес использует деревья, а бустинг — логистическую регрессию"
      - text: "Лес требует масштабирования признаков, бустинг — нет"
      - text: "Они отличаются только названием"
    explanation: "Оба метода — ансамбли деревьев. Лес снижает ошибку усреднением независимых деревьев, бустинг — последовательным исправлением остаточных ошибок, поэтому бустингу нужна настройка скорости обучения и числа деревьев."

  - text: "Перекрёстная проверка на 299 пациентах дала AUC 0,772 ± 0,049 у логистической регрессии и 0,775 ± 0,079 у случайного леса. Какой вывод обоснован?"
    lesson: s3-l6
    options:
      - text: "Случайный лес лучше, нужно выбрать его"
      - text: "Различие намного меньше разброса оценок; на этих данных модели неразличимы, и разумно предпочесть более простую"
        correct: true
      - text: "Логистическая регрессия переобучена"
      - text: "Обе модели бесполезны"
    explanation: "Разница в 0,003 теряется на фоне разброса в 0,05–0,08 между частями данных. Когда качество неразличимо, преимущество у модели, которую проще объяснить и проверить."

  - text: "Встроенная оценка важности признаков случайного леса ставит КФК и тромбоциты высоко, хотя статистические тесты не нашли различий по ним между умершими и выжившими. Чем это объясняется?"
    lesson: s3-l6
    options:
      - text: "Тесты ошиблись, лес нашёл истинную связь"
      - text: "Эта оценка завышает важность признаков с большим числом разных значений"
        correct: true
      - text: "КФК и тромбоциты — бинарные признаки"
      - text: "В лесу было слишком мало деревьев"
    explanation: "У непрерывного показателя много возможных порогов, а значит, больше шансов случайно дать «удачное» разбиение. Важность по уменьшению неоднородности систематически завышена для таких признаков."
