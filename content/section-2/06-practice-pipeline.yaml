packages: [pandas, scikit-learn]
datasets: [heart_disease.csv]

statement: |
  Соберите конвейер подготовки признаков для данных об ишемической болезни сердца — такой же по устройству, как в уроке, но с другим набором признаков и другим разбиением.

  Данные загружены и очищены, списки признаков `numeric`, `categorical` и `binary` заданы.

  1. Разделите `X` и `y` на обучающую и тестовую части функцией `train_test_split`: `test_size=0.2`, `random_state=7`, `stratify=y`. Результат сохраните в `X_train`, `X_test`, `y_train`, `y_test`. Запишите размеры выборок в `n_train` и `n_test`.
  2. `chol_median_train` — медиана холестерина **в обучающей выборке**. Именно этим числом конвейер будет заполнять пропуски.
  3. Создайте `preprocess` — объект `ColumnTransformer` из трёх частей **в таком порядке**:
     - количественные признаки (`numeric`): заполнение медианой, затем `StandardScaler`;
     - категориальные (`categorical`): заполнение самым частым значением, затем `OneHotEncoder(handle_unknown="ignore", sparse_output=False)`;
     - бинарные (`binary`): заполнение самым частым значением.
  4. Обучите конвейер на обучающей выборке и преобразуйте обе: `X_train_prepared` и `X_test_prepared`.
  5. Сохраните:
     - `n_features_out` — число столбцов в `X_train_prepared`;
     - `n_missing_after` — общее число пропусков в двух подготовленных матрицах;
     - `test_age_mean` — среднее значение первого столбца (это возраст) в `X_test_prepared`.

  ::: warning Где чаще всего ошибаются
  К тестовой выборке применяют только `transform`. Если вызвать для неё `fit_transform`, параметры пересчитаются по тестовым пациентам — проверка `test_age_mean` это обнаружит.
  :::

