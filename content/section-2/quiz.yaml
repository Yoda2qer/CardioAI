questions:
  - text: "Креатинин сыворотки в данных резко скошен вправо. Как правильно описать его в таблице характеристик пациентов?"
    lesson: s2-l1
    options:
      - text: "Среднее ± стандартное отклонение"
      - text: "Медиана и квартили: медиана [Q1; Q3]"
        correct: true
      - text: "Минимум и максимум"
      - text: "Число и доля пациентов"
    explanation: "Для скошенных показателей среднее завышено немногими высокими значениями, а запись «± SD» подразумевает симметричный разброс, которого нет. Медиана и квартили описывают типичного пациента честнее."

  - text: "Летальность в выборке — 32,1%, 95% доверительный интервал 27,1–37,6%. Какие утверждения верны?"
    lesson: s2-l1
    options:
      - text: "Данные совместимы с истинной летальностью примерно от 27 до 38%"
        correct: true
      - text: "При увеличении числа пациентов интервал станет уже"
        correct: true
      - text: "У 95% пациентов летальность лежит в этом диапазоне"
      - text: "Истинная летальность в точности равна 32,1%"
    explanation: "Доверительный интервал описывает неопределённость оценки по выборке, а не разброс между пациентами. Его ширина уменьшается с ростом объёма выборки: чтобы сузить интервал вдвое, нужно вчетверо больше наблюдений."

  - text: "Критерий Шапиро—Уилка отвергает нормальность распределения возраста (p < 0,001) при 299 наблюдениях, хотя точки на графике квантилей лежат почти на прямой. Как это понимать?"
    lesson: s2-l1
    options:
      - text: "График ошибается: доверять нужно только тесту"
      - text: "На выборке такого размера тест замечает даже незначительные отклонения; решение принимают по графику и смыслу показателя"
        correct: true
      - text: "Возраст нельзя анализировать статистическими методами"
      - text: "В данных есть ошибка, которую нужно найти и исправить"
    explanation: "Чувствительность теста нормальности растёт с объёмом выборки: при сотнях наблюдений он отвергает нормальность из-за мелочей вроде округления до целых лет. Практически важна не формальная нормальность, а отсутствие грубой асимметрии."

  - text: "Нужно сравнить уровень креатинина (распределение скошено, есть выбросы) у умерших и выживших пациентов. Какой тест выбрать?"
    lesson: s2-l2
    options:
      - text: "Критерий хи-квадрат"
      - text: "Критерий Манна—Уитни"
        correct: true
      - text: "Парный t-критерий"
      - text: "Точный критерий Фишера"
    explanation: "Критерий Манна—Уитни сравнивает две независимые группы по рангам и не чувствителен к выбросам. Хи-квадрат и критерий Фишера предназначены для долей, а парный тест — для повторных измерений у одних и тех же пациентов."

  - text: "Что такое p-значение?"
    lesson: s2-l2
    options:
      - text: "Вероятность того, что нулевая гипотеза верна"
      - text: "Вероятность получить такое же или более выраженное различие, если на самом деле различий нет"
        correct: true
      - text: "Вероятность того, что результат воспроизведётся в другом исследовании"
      - text: "Доля пациентов, у которых проявился эффект"
    explanation: "p-значение считается в предположении, что нулевая гипотеза верна, и показывает, насколько необычны наблюдаемые данные при этом предположении. Вероятность самой гипотезы оно не оценивает."

  - text: "Летальность у пациентов с артериальной гипертензией — 37,1%, без неё — 29,4%; критерий хи-квадрат дал p = 0,21. Какой вывод корректен?"
    lesson: s2-l2
    options:
      - text: "Доказано, что гипертензия не влияет на исход"
      - text: "Имеющихся данных недостаточно, чтобы утверждать, что связь есть; её отсутствие при этом не доказано"
        correct: true
      - text: "Гипертензия повышает летальность на 21%"
      - text: "Результат ошибочен, тест нужно повторять, пока p не станет меньше 0,05"
    explanation: "p > 0,05 означает лишь, что разницу можно объяснить случайностью при таком объёме выборки. Это не доказательство отсутствия эффекта. Повторять тесты до получения «нужного» p — это p-хакинг."

  - text: "Исследователь сравнивает между двумя группами 20 показателей и применяет поправку Бонферрони. Какой порог значимости следует использовать для каждого сравнения?"
    lesson: s2-l2
    options:
      - text: "0,05"
      - text: "0,0025"
        correct: true
      - text: "0,01"
      - text: "1,0"
    explanation: "Поправка Бонферрони делит исходный порог на число сравнений: 0,05 / 20 = 0,0025. Без поправки при 20 проверках в среднем одна «значимая» находка появится чисто случайно."

  - text: "Что следует привести в отчёте вместе с p-значением?"
    lesson: s2-l2
    options:
      - text: "Размер эффекта — например, разность средних или долей"
        correct: true
      - text: "Доверительный интервал для размера эффекта"
        correct: true
      - text: "Сколько всего сравнений было выполнено"
        correct: true
      - text: "Ничего: p-значения достаточно"
    explanation: "p не говорит о величине эффекта. Размер эффекта с доверительным интервалом показывает клинический масштаб различия, а число выполненных сравнений позволяет оценить риск ложных находок."

  - text: "В каком случае коэффициент корреляции Спирмена предпочтительнее коэффициента Пирсона?"
    lesson: s2-l4
    options:
      - text: "Когда оба показателя распределены строго нормально"
      - text: "Когда распределения скошены или есть выбросы, а связь монотонная, но не обязательно линейная"
        correct: true
      - text: "Когда нужно доказать причинную связь"
      - text: "Когда в выборке больше тысячи пациентов"
    explanation: "Коэффициент Спирмена считается по рангам, поэтому устойчив к выбросам и улавливает любую монотонную связь. Причинность не доказывает ни один коэффициент корреляции."

  - text: "В объединённых данных четырёх клиник холестерин отрицательно связан с ИБС, но ни в одной клинике по отдельности такой связи нет. Как называется это явление и чем оно вызвано?"
    lesson: s2-l4
    options:
      - text: "Мультиколлинеарность: холестерин дублирует другой признак"
      - text: "Парадокс Симпсона: клиника связана и со способом записи холестерина, и с долей больных"
        correct: true
      - text: "Утечка данных: тестовые пациенты попали в обучение"
      - text: "Множественные сравнения: проверено слишком много гипотез"
    explanation: "Клиника здесь — вмешивающийся фактор: в швейцарских данных холестерин записан нулём, а ИБС есть почти у всех. При объединении это создаёт ложную обратную связь, которой нет внутри подгрупп."

  - text: "Из 105 женщин в данных курят четыре, из 194 мужчин — 92. Оба признака включены в модель. Что это означает для интерпретации её коэффициентов?"
    lesson: s2-l4
    options:
      - text: "Ничего: модель точно разделит вклад пола и курения"
      - text: "Признаки коллинеарны: их вклад трудно разделить, коэффициенты неустойчивы"
        correct: true
      - text: "Курение следует считать целевой переменной"
      - text: "Данные содержат ошибку ввода"
    explanation: "Когда один признак почти определяется другим, модель не может надёжно разделить их эффекты: коэффициенты меняются от выборки к выборке, а доверительные интервалы расширяются."

  - text: "В наблюдательном исследовании пациенты, получающие больше лекарственных препаратов, умирают чаще. Какое объяснение наиболее вероятно?"
    lesson: s2-l4
    options:
      - text: "Число препаратов само по себе вызывает смерть"
      - text: "Тяжесть состояния — вмешивающийся фактор: тяжёлым больным назначают больше препаратов, и они же чаще умирают"
        correct: true
      - text: "Связь случайна и исчезнет при увеличении выборки"
      - text: "Данные о лекарствах внесены с ошибкой"
    explanation: "Тяжесть заболевания связана и с объёмом терапии, и с исходом, создавая связь между ними. Чтобы судить о влиянии лечения, конфаундер учитывают в модели или проводят рандомизированное исследование."

  - text: "Почему среднее и стандартное отклонение для масштабирования признаков рассчитывают только по обучающей выборке?"
    lesson: s2-l5
    options:
      - text: "Так вычисления выполняются быстрее"
      - text: "Иначе сведения о тестовых пациентах попадут в обучение и оценка качества модели будет завышена"
        correct: true
      - text: "В тестовой выборке не бывает пропусков"
      - text: "Масштабирование тестовой выборке не требуется"
    explanation: "Параметры подготовки — часть модели. Если оценивать их по всей таблице, возникает утечка данных. К тестовой выборке применяют уже посчитанные параметры, как к любому новому пациенту."

  - text: "Тип боли в груди `cp` принимает четыре значения без естественного порядка. Как подготовить этот признак для логистической регрессии?"
    lesson: s2-l5
    options:
      - text: "Оставить числом от 1 до 4"
      - text: "Заменить четырьмя бинарными столбцами (one-hot-кодирование)"
        correct: true
      - text: "Стандартизировать: вычесть среднее и разделить на стандартное отклонение"
      - text: "Удалить: категориальные признаки использовать нельзя"
    explanation: "Числовая запись номинальной категории навязывает модели несуществующий порядок и расстояния между значениями. One-hot-кодирование даёт каждой категории собственный столбец."

  - text: "Строится модель, которая должна оценивать вероятность ИБС при первичном осмотре в любой из клиник. Какие признаки не следует в неё включать?"
    lesson: s2-l5
    options:
      - text: "Результат коронарной ангиографии"
        correct: true
      - text: "Номер истории болезни"
        correct: true
      - text: "Число сосудов по данным флюороскопии, заполненное почти только в одной клинике"
        correct: true
      - text: "Возраст пациента"
    explanation: "Ангиография недоступна в момент прогноза и, по сути, сама является ответом. Номер истории болезни — технический идентификатор. Признак, которого нет в большинстве клиник, делает модель неприменимой там. Возраст известен всегда и клинически осмыслен."
