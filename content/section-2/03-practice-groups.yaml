packages: [pandas, scipy]
datasets: [heart_failure.csv]

statement: |
  Продолжаем готовить «Таблицу 1» для данных о сердечной недостаточности: теперь нужно выяснить, по каким показателям умершие и выжившие пациенты различаются неслучайно.

  Таблица загружена в `hf`, группы `died` и `alive` уже созданы.

  1. `median_creat_dead` и `median_creat_alive` — медианы креатинина сыворотки у умерших и у выживших.
  2. `p_age` — p-значение t-критерия Уэлча для возраста (`scipy.stats.ttest_ind` с `equal_var=False`).
  3. `age_diff_ci` — список из двух чисел: нижняя и верхняя границы 95% доверительного интервала для разности среднего возраста **умершие минус выжившие**.
  4. `p_creat` — p-значение критерия Манна—Уитни для креатинина.
  5. `p_hbp` — p-значение критерия хи-квадрат для связи артериальной гипертензии (`high_blood_pressure`) с исходом. Параметры функции оставьте по умолчанию.
  6. `significant` — список названий тех признаков из списка `features`, которые различаются между группами по критерию Манна—Уитни **с поправкой Бонферрони**: p меньше 0,05, делённого на число признаков в списке.

  ::: note Подсказка по шагу 3
  Результат `ttest_ind` имеет метод `confidence_interval()`. Он возвращает объект с полями `low` и `high`. Порядок групп в вызове определяет знак разности.
  :::

