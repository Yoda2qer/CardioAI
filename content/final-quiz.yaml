questions:
  - text: "В выгрузке из медицинской информационной системы одна строка соответствует одной госпитализации. Что нужно сделать, прежде чем считать «долю пациентов с исходом»?"
    lesson: s1-l1
    options:
      - text: "Ничего: число строк равно числу пациентов"
      - text: "Выяснить, сколько госпитализаций приходится на одного пациента, и считать долю по пациентам"
        correct: true
      - text: "Удалить все строки с пропусками"
      - text: "Отсортировать таблицу по дате"
    explanation: "Наблюдение в таблице не обязательно равно пациенту. Если один человек госпитализирован трижды, подсчёт по строкам исказит доли — нужен идентификатор пациента."

  - text: "Для публикации нужно показать возраст пациентов, но в выборке есть единственный пациент 96 лет. Какое решение снижает риск его узнавания?"
    lesson: s1-l2
    options:
      - text: "Указать возраст точно — это не прямой идентификатор"
      - text: "Объединить крайние значения в группу «90 лет и старше»"
        correct: true
      - text: "Заменить возраст случайным числом"
      - text: "Удалить из таблицы столбец с полом"
    explanation: "Редкие значения квазиидентификаторов делают человека узнаваемым. Объединение крайних значений — стандартный приём обобщения, который сохраняет смысл данных."

  - text: "Средний холестерин в таблице — 199 мг/дл, медиана — 223, минимальное значение — 0. Что вероятнее всего произошло?"
    lesson: s1-l5
    options:
      - text: "В выборке много пациентов с наследственной гипохолестеринемией"
      - text: "Отсутствующие измерения закодированы нулём и тянут среднее вниз"
        correct: true
      - text: "Холестерин измерен в разных единицах"
      - text: "Медиана посчитана с ошибкой"
    explanation: "Нулевой холестерин физиологически невозможен; так записывают отсутствие анализа. Такие скрытые пропуски нужно заменить настоящими пропусками до любых расчётов."

  - text: "Какой график честнее всего покажет, различается ли распределение креатинина у выживших и умерших пациентов?"
    lesson: s1-l6
    options:
      - text: "Столбчатая диаграмма средних значений с осью от 1 мг/дл"
      - text: "Ящики с усами для двух групп, при необходимости на логарифмической шкале"
        correct: true
      - text: "Круговая диаграмма"
      - text: "Линейный график креатинина по номеру строки"
    explanation: "Ящик с усами показывает медиану, разброс и выбросы в каждой группе, а логарифмическая шкала помогает увидеть скошенный лабораторный показатель."

  - text: "Креатинфосфокиназу описывают в статье как «582 ± 970 мкг/л». Что не так с такой записью?"
    lesson: s2-l1
    options:
      - text: "Всё верно: так описывают любые количественные показатели"
      - text: "Распределение сильно скошено; среднее ± SD подразумевает симметрию, нужны медиана и квартили"
        correct: true
      - text: "Стандартное отклонение не может быть больше среднего, это ошибка расчёта"
      - text: "Нужно указывать минимум и максимум вместо среднего"
    explanation: "Стандартное отклонение больше среднего — признак сильной правой асимметрии. Для таких показателей приводят медиану [Q1; Q3]."

  - text: "Исследование на 12 000 пациентах нашло, что новый препарат снижает систолическое АД на 0,8 мм рт. ст., p = 0,001. Как это оценить?"
    lesson: s2-l2
    options:
      - text: "Препарат очень эффективен: p меньше 0,01"
      - text: "Эффект статистически значим, но клинически ничтожен — оценивать нужно величину эффекта"
        correct: true
      - text: "Результат ошибочен: при таком p эффект должен быть больше"
      - text: "Нужно повторить исследование на меньшей выборке"
    explanation: "На больших выборках значимыми становятся крошечные различия. Решение принимают по размеру эффекта и его доверительному интервалу, а не по одному p-значению."

  - text: "В общей выборке пациенты, принимающие статины, реже умирают, но внутри групп одного возраста и тяжести разницы нет. Как называется роль возраста и тяжести?"
    lesson: s2-l4
    options:
      - text: "Мультиколлинеарность"
      - text: "Вмешивающиеся факторы (конфаундеры)"
        correct: true
      - text: "Утечка данных"
      - text: "Цензурирование"
    explanation: "Конфаундер связан и с воздействием, и с исходом. Стратификация показала, что связь объяснялась различиями групп по возрасту и тяжести, а не самим препаратом."

  - text: "Где допущена утечка данных?"
    lesson: s2-l5
    options:
      - text: "Медиана для заполнения пропусков посчитана по обучающей выборке и применена к тестовой"
      - text: "Стандартизация выполнена по всей таблице до разделения на обучающую и тестовую части"
        correct: true
      - text: "Категориальный признак закодирован one-hot внутри конвейера"
      - text: "Разделение выполнено со стратификацией по исходу"
    explanation: "Среднее и стандартное отклонение, посчитанные по всей таблице, содержат сведения о тестовых пациентах. Параметры подготовки оценивают только на обучающей части."

  - text: "Модель предсказывает внутрибольничную смерть с долей верных ответов 96%; умирает 4% пациентов. Что нужно проверить в первую очередь?"
    lesson: s3-l1
    options:
      - text: "Скорость работы модели"
      - text: "Чем модель лучше ответа «все выживут», который тоже даёт 96%"
        correct: true
      - text: "Сколько признаков использует модель"
      - text: "Какой язык программирования использовался"
    explanation: "При редком исходе доля верных ответов вводит в заблуждение: точка отсчёта уже очень высока. Нужны чувствительность, специфичность и сравнение с точкой отсчёта."

  - text: "Логистическая регрессия дала для курения отношение шансов 1,10 (95% ДИ 0,68–1,80). Пол и курение в данных сильно связаны. Какой вывод корректен?"
    lesson: s3-l2
    options:
      - text: "Курение безвредно для пациентов с сердечной недостаточностью"
      - text: "Данные не позволяют оценить отдельный вклад курения; интервал широк, а признак коллинеарен с полом"
        correct: true
      - text: "Курение повышает риск на 10%, это доказано"
      - text: "Модель нужно переобучить без пола, и тогда эффект курения станет истинным"
    explanation: "Интервал включает 1, а коллинеарность с полом мешает разделить эффекты. Отсутствие доказательства связи не означает доказательства её отсутствия."

  - text: "Дерево решений без ограничения глубины даёт 100% верных ответов на обучающей выборке. Что это означает?"
    lesson: s3-l4
    options:
      - text: "Модель идеальна"
      - text: "Это ничего не говорит о качестве: модель могла запомнить данные; смотреть нужно на тестовую выборку"
        correct: true
      - text: "В данных нет шума"
      - text: "Тестовая выборка не нужна"
    explanation: "Неограниченное дерево делит данные, пока не опишет каждого пациента. Качество на обучающей выборке при этом всегда максимально и не отражает работу на новых пациентах."

  - text: "Для таблицы из 300 пациентов с 96 событиями перекрёстная проверка дала AUC: логистическая регрессия 0,77 ± 0,05, градиентный бустинг 0,72 ± 0,08. Что разумно сделать?"
    lesson: s3-l6
    options:
      - text: "Выбрать бустинг: он сложнее и потому надёжнее"
      - text: "Предпочесть логистическую регрессию: она не хуже, проще в объяснении и меньше склонна к переобучению на малых данных"
        correct: true
      - text: "Объединить модели, сложив их прогнозы"
      - text: "Сообщить, что обе модели бесполезны"
    explanation: "Сложная модель должна доказать преимущество. На малых данных с простыми связями логистическая регрессия часто не уступает ансамблям, а различие внутри разброса оценок ничего не доказывает."

  - text: "Чувствительность модели 90%, специфичность 80%. В какой популяции прогностическая ценность положительного результата будет выше?"
    lesson: s4-l1
    options:
      - text: "Среди пациентов кардиологического стационара, где болезнь у половины"
        correct: true
      - text: "При массовом скрининге, где болезнь у 2%"
      - text: "Одинаковой — она зависит только от модели"
      - text: "Это нельзя определить без AUC"
    explanation: "PPV растёт вместе с распространённостью. При 2% больных большинство положительных результатов будут ложными, даже при неплохих чувствительности и специфичности."

  - text: "Модель выявления сепсиса используется для раннего оповещения, где пропуск опасен. Как выбрать порог?"
    lesson: s4-l2
    options:
      - text: "Всегда использовать 0,5"
      - text: "Выбрать порог, обеспечивающий требуемую высокую чувствительность, и оценить число ложных тревог, которое выдержит отделение"
        correct: true
      - text: "Подобрать порог, при котором доля верных ответов на тестовой выборке максимальна"
      - text: "Выбрать порог с максимальной специфичностью"
    explanation: "Порог задаётся ценой ошибок сценария. Подбирать его по лучшим цифрам на тестовой выборке нельзя — это завышает оценку."

  - text: "Модель прогноза повторной госпитализации обучили на данных, где есть признак «число дней до повторной госпитализации». AUC = 0,99. Что произошло?"
    lesson: s4-l4
    options:
      - text: "Модель отлично работает"
      - text: "Утечка данных: признак известен только после наступления исхода"
        correct: true
      - text: "Мультиколлинеарность"
      - text: "Недообучение"
    explanation: "Признак, вычисленный после исхода, фактически содержит ответ. Подозрительно высокое качество — повод проверить каждый признак: был ли он известен в момент прогноза."

  - text: "Модель, перенесённая в другую клинику, сохранила AUC, но предсказывает в среднем 45% риска при реальной частоте 30%. Что нужно сделать перед использованием?"
    lesson: s4-l5
    options:
      - text: "Ничего: AUC не изменился"
      - text: "Рекалибровать модель на данных новой клиники"
        correct: true
      - text: "Удалить половину признаков"
      - text: "Снизить порог до 0,1"
    explanation: "Различающая способность сохранилась, а калибровка нарушилась. Решения, привязанные к абсолютному риску, требуют исправления вероятностей под новую популяцию."

  - text: "Почему для данных с разным сроком наблюдения нельзя просто посчитать долю умерших?"
    lesson: s5-l1
    options:
      - text: "Потому что смертность всегда считают в процентах за год"
      - text: "Потому что у части выживших наблюдение закончилось рано, и их дальнейшая судьба неизвестна"
        correct: true
      - text: "Потому что умерших всегда больше половины"
      - text: "Потому что срок наблюдения измерен в днях"
    explanation: "Цензурированные пациенты прожили «не меньше» своего срока наблюдения. Простая доля считает их пережившими весь период и занижает смертность."

  - text: "В модели Кокса отношение рисков для фактора равно 0,63 на 10 процентных пунктов фракции выброса. Как это прочитать?"
    lesson: s5-l4
    options:
      - text: "У 63% пациентов фракция выброса выше 10%"
      - text: "Увеличение фракции выброса на 10 п. п. снижает мгновенный риск смерти примерно на треть при прочих равных"
        correct: true
      - text: "Каждые 10 п. п. фракции выброса увеличивают риск в 1,63 раза"
      - text: "Пациенты с фракцией выброса выше 63% не умирают"
    explanation: "HR < 1 означает снижение риска: 0,63 — это снижение мгновенного риска на 37% при увеличении фракции выброса на 10 п. п. и неизменных остальных факторах."

  - text: "Какой подход к проверке модели на справедливость правильный?"
    lesson: s5-l6
    options:
      - text: "Достаточно общего AUC по всей выборке"
      - text: "Сравнить чувствительность, специфичность и калибровку модели в подгруппах (пол, возраст, место лечения)"
        correct: true
      - text: "Удалить из модели все демографические признаки, и проблема исчезнет"
      - text: "Обучить отдельную модель для каждого пациента"
    explanation: "Одинаковый средний AUC может скрывать разные последствия для групп. Удаление признака переносит различие в другой вид ошибок, а не устраняет его."

  - text: "Какой уровень доказательств нужен, чтобы утверждать, что система ИИ улучшает исходы лечения?"
    lesson: s5-l7
    options:
      - text: "Высокий AUC при внутренней проверке"
      - text: "Внешняя валидация на данных другой клиники"
      - text: "Исследование влияния на исходы, в идеале рандомизированное"
        correct: true
      - text: "Регистрация системы как медицинского изделия"
    explanation: "Валидация доказывает, что модель различает пациентов. Улучшает ли она исходы, зависит от того, как врачи используют прогноз, и проверяется только исследованием влияния."
