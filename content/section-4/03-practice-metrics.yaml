packages: [pandas, scikit-learn]
datasets: [heart_disease.csv]

statement: |
  Оцените модель диагностики ИБС как диагностический тест и подберите порог для сценария, в котором важно не пропускать больных.

  Модель `model` уже обучена, вероятности ИБС для тестовых пациентов лежат в `proba`. Разбиение здесь другое, чем в уроках, поэтому числа будут отличаться.

  1. При пороге 0,5 посчитайте элементы матрицы ошибок: `tp`, `fp`, `tn`, `fn`.
  2. По ним вычислите `sensitivity`, `specificity`, `ppv` и `npv`.
  3. `auc` — площадь под ROC-кривой.
  4. Найдите **самый высокий** порог, при котором чувствительность не ниже 0,90. Сохраните порог в `threshold_90`, а специфичность при нём — в `specificity_90`. Удобнее всего взять массивы из `roc_curve`.
  5. `ppv_screening` — прогностическая ценность положительного результата при пороге 0,5, если ту же модель применить там, где ИБС есть у 10% обследуемых. Используйте `sensitivity` и `specificity` из шага 2.

  ::: note Формула для шага 5
  PPV = Se × p / (Se × p + (1 − Sp) × (1 − p)), где p — распространённость.
  :::

  ::: clinic Сравните два значения PPV
  Одна и та же модель, один и тот же порог — и два очень разных ответа на вопрос «насколько можно верить положительному результату». Подумайте, что это означает для идеи использовать модель, обученную на пациентах стационара, в массовом скрининге.
  :::

