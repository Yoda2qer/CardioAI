questions:
  - text: "На тестовой выборке модель верно распознала 109 больных и пропустила 18. Чему равна её чувствительность?"
    lesson: s4-l1
    options:
      - text: "109 / (109 + 18) ≈ 0,86"
        correct: true
      - text: "18 / 109 ≈ 0,17"
      - text: "109 / 230 ≈ 0,47"
      - text: "Для расчёта нужно знать число ложноположительных результатов"
    explanation: "Чувствительность — доля найденных больных среди всех больных: TP / (TP + FN). Ложноположительные результаты в эту формулу не входят — они нужны для специфичности и PPV."

  - text: "Модель назвала пациента больным. Какая метрика показывает, с какой вероятностью это действительно так?"
    lesson: s4-l1
    options:
      - text: "Чувствительность"
      - text: "Специфичность"
      - text: "Прогностическая ценность положительного результата (PPV)"
        correct: true
      - text: "Доля верных ответов"
    explanation: "PPV — доля действительно больных среди тех, кого модель назвала больными: TP / (TP + FP). Чувствительность отвечает на обратный вопрос: какую долю больных модель находит."

  - text: "Модель с чувствительностью 86% и специфичностью 74% разработана в стационаре, где ИБС есть у 55% обследуемых. Её хотят применить для скрининга там, где болезнь есть у 1%. Что произойдёт с прогностической ценностью положительного результата?"
    lesson: s4-l1
    options:
      - text: "Не изменится: это свойство модели"
      - text: "Вырастет, потому что здоровых станет больше"
      - text: "Упадёт до нескольких процентов: почти все положительные результаты будут ложными"
        correct: true
      - text: "Станет равной чувствительности"
    explanation: "PPV зависит от распространённости. При 1% больных на каждого истинно положительного приходятся десятки ложноположительных, и PPV падает примерно до 3%."

  - text: "Какие характеристики модели не зависят от распространённости болезни среди обследуемых?"
    lesson: s4-l1
    options:
      - text: "Чувствительность"
        correct: true
      - text: "Специфичность"
        correct: true
      - text: "Прогностическая ценность положительного результата"
      - text: "Прогностическая ценность отрицательного результата"
    explanation: "Чувствительность считается только по больным, специфичность — только по здоровым, поэтому соотношение этих групп на них не влияет. PPV и NPV объединяют обе группы и меняются вместе с распространённостью."

  - text: "AUC модели равен 0,90. Что означает это число?"
    lesson: s4-l2
    options:
      - text: "Модель верна в 90% случаев"
      - text: "Случайно выбранный больной с вероятностью 90% получит от модели более высокую оценку, чем случайно выбранный здоровый"
        correct: true
      - text: "У 90% пациентов предсказанный риск выше порога"
      - text: "Предсказанные вероятности в среднем отличаются от истинных на 10%"
    explanation: "AUC измеряет способность модели правильно упорядочивать пациентов. Он не равен доле верных ответов и ничего не говорит о точности самих вероятностей."

  - text: "Порог, при котором модель называет пациента больным, снизили с 0,5 до 0,2. Как изменятся чувствительность и специфичность?"
    lesson: s4-l2
    options:
      - text: "Обе вырастут"
      - text: "Чувствительность вырастет, специфичность снизится"
        correct: true
      - text: "Чувствительность снизится, специфичность вырастет"
      - text: "Не изменятся: они зависят только от модели"
    explanation: "При более низком пороге больными называют больше пациентов: пропусков становится меньше, а ложных тревог больше. Чувствительность и специфичность связаны обратной зависимостью."

  - text: "Модель предсказывает редкое событие, которое случается у 2% пациентов. Какой график полезно посмотреть в дополнение к ROC-кривой?"
    lesson: s4-l2
    options:
      - text: "PR-кривую: зависимость прогностической ценности положительного результата от чувствительности"
        correct: true
      - text: "Гистограмму возраста пациентов"
      - text: "Круговую диаграмму классов"
      - text: "Никакой: ROC-кривой всегда достаточно"
    explanation: "ROC-кривая не учитывает распространённость и при редких событиях может выглядеть отлично, хотя большинство срабатываний ложные. PR-кривая показывает именно долю истинных среди срабатываний."

  - text: "На каких данных нельзя подбирать порог классификации?"
    lesson: s4-l2
    options:
      - text: "На обучающей выборке с перекрёстной проверкой"
      - text: "На отдельной валидационной выборке"
      - text: "На тестовой выборке, по которой затем сообщается итоговое качество"
        correct: true
      - text: "Порог вообще нельзя менять"
    explanation: "Порог, выбранный по тестовым пациентам, подогнан под них, и метрики на тех же пациентах получаются завышенными. Тестовая выборка нужна для единственной итоговой проверки."

  - text: "В чём преимущество перекрёстной проверки перед единственным разбиением на обучающую и тестовую выборки?"
    lesson: s4-l4
    options:
      - text: "Она работает быстрее"
      - text: "Каждый пациент однажды оказывается в тесте; получается более устойчивая оценка и её разброс"
        correct: true
      - text: "Она исключает переобучение"
      - text: "Она не требует подготовки признаков"
    explanation: "Одно разбиение даёт одну случайную оценку. Перекрёстная проверка усредняет несколько и показывает разброс между частями, по которому можно судить о надёжности результата."

  - text: "Добавление столбца `time` (срок наблюдения) повысило AUC модели смертности с 0,77 до 0,88. Почему этот признак нельзя использовать?"
    lesson: s4-l4
    options:
      - text: "Он измерен в днях, а не в годах"
      - text: "Срок наблюдения становится известен только вместе с исходом: это утечка данных"
        correct: true
      - text: "В нём слишком много пропусков"
      - text: "Он коррелирует с возрастом"
    explanation: "У умершего пациента наблюдение обрывается в день смерти, поэтому короткий срок почти равнозначен исходу. В момент, когда нужен прогноз, это значение ещё неизвестно."

  - text: "Что из перечисленного приводит к утечке данных?"
    lesson: s4-l4
    options:
      - text: "Отбор лучших признаков по всей таблице до перекрёстной проверки"
        correct: true
      - text: "Попадание разных госпитализаций одного пациента в обучающую и тестовую выборки"
        correct: true
      - text: "Использование признака «переведён в реанимацию» для прогноза тяжёлого течения"
        correct: true
      - text: "Масштабирование признаков внутри конвейера Pipeline"
    explanation: "Во всех трёх случаях модель получает сведения, недоступные при реальном применении: о тестовых пациентах, о том же человеке или о событии, которое является следствием исхода. Конвейер, наоборот, от утечки защищает."

  - text: "Из 2000 столбцов случайных чисел по всей таблице отобрали 20, сильнее всего связанных с исходом, и перекрёстная проверка показала AUC 0,86. Как это объяснить?"
    lesson: s4-l4
    options:
      - text: "Случайные числа действительно предсказывают исход"
      - text: "Отбор признаков использовал исходы тестовых пациентов; при отборе внутри проверки AUC близок к 0,5"
        correct: true
      - text: "Модель недообучена"
      - text: "Двадцати признаков недостаточно"
    explanation: "Среди тысяч случайных столбцов найдутся совпавшие с исходом по случайности. Если выбирать их с учётом всех пациентов, тестовые данные участвуют в обучении — это утечка через подготовку."

  - text: "Модель перенесли в другую клинику. AUC остался прежним, но средний предсказанный риск — 44%, а реальная доля больных — 36%. Что нарушено?"
    lesson: s4-l5
    options:
      - text: "Различающая способность"
      - text: "Калибровка: модель систематически завышает риск и требует рекалибровки"
        correct: true
      - text: "Чувствительность"
      - text: "Ничего: модель работает как раньше"
    explanation: "AUC оценивает порядок пациентов, а не правильность вероятностей. Расхождение среднего прогноза с наблюдаемой частотой — нарушение калибровки, которое типично при смене популяции."

  - text: "Встроенная оценка случайного леса ставит признак высоко, а его перестановочная важность на тестовой выборке близка к нулю. Что это означает?"
    lesson: s4-l5
    options:
      - text: "Признак — главный предиктор исхода"
      - text: "Модель строила разбиения по признаку, но на качество прогноза для новых пациентов он не влияет"
        correct: true
      - text: "Перестановочная важность посчитана с ошибкой"
      - text: "Признак нужно закодировать one-hot"
    explanation: "Встроенная важность завышена для признаков с большим числом значений. Перестановочная важность измеряет реальный вклад в качество на тестовых данных: если перемешивание ничего не меняет, признак модели не нужен."

  - text: "У признака высокая важность в модели прогноза. Можно ли на этом основании утверждать, что воздействие на этот признак улучшит исход?"
    lesson: s4-l5
    options:
      - text: "Да: важность признака равна его причинному вкладу"
      - text: "Нет: важность показывает, что модель использует признак, а не что он является причиной исхода"
        correct: true
      - text: "Да, если AUC модели выше 0,8"
      - text: "Нет, потому что важность нельзя вычислить для клинических данных"
    explanation: "Модель прогноза выявляет связи, а не причины. Маркер тяжести состояния может быть важен для прогноза и не быть мишенью для лечения; причинные выводы требуют рандомизированных исследований."
