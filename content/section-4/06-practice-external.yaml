packages: [pandas, scikit-learn]
datasets: [heart_disease.csv]

statement: |
  Самая строгая проверка модели — **внешняя валидация**: применение к пациентам другого учреждения. Вы разработаете модель диагностики ИБС на данных двух клиник и проверите её в двух других, где она не обучалась.

  Данные загружены, функция `make_model()` возвращает новый необученный конвейер с логистической регрессией.

  1. Отберите в таблицу `development` пациентов клиник `cleveland` и `hungary` — на них модель разрабатывается. Число строк сохраните в `n_development`.
  2. `auc_internal` — средний AUC перекрёстной проверки (`cross_val_score` с `cv=cv`, `scoring="roc_auc"`) на таблице `development`. Это оценка, которую получили бы сами разработчики.
  3. Обучите `model = make_model()` на всей таблице `development`.
  4. Проверьте модель на пациентах клиники `long_beach`:
     - `auc_long_beach` — площадь под ROC-кривой;
     - `mean_risk_long_beach` — средняя предсказанная вероятность ИБС;
     - `prevalence_long_beach` — реальная доля пациентов с ИБС;
     - `sensitivity_long_beach` и `specificity_long_beach` — при пороге 0,5.
  5. `auc_switzerland` — площадь под ROC-кривой на пациентах клиники `switzerland`.
  6. `auc_drop` — разность `auc_internal` и `auc_long_beach`: сколько различающей способности модель потеряла при переносе.

  Признаки для модели перечислены в списке `features`, исход — в столбце `target`.

  ::: clinic Что обсудить после решения
  Сравните `mean_risk_long_beach` и `prevalence_long_beach`: завышает модель риск или занижает? Вспомните из первого раздела, чем данные Лонг-Бич и швейцарских клиник отличались от кливлендских: доля пропусков, записанный нулём холестерин, состав пациентов. Какие из этих различий могли повлиять на результат?
  :::

