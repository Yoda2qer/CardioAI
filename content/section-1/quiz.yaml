questions:
  - text: "Тип боли в груди (`cp`) закодирован числами от 1 до 4: типичная стенокардия, атипичная стенокардия, неангинозная боль, боли нет. К какому типу относится этот признак?"
    lesson: s1-l1
    options:
      - text: "Количественный: значения записаны числами"
      - text: "Категориальный: числа — это номера категорий"
        correct: true
      - text: "Бинарный: боль либо есть, либо её нет"
      - text: "Целевая переменная"
    explanation: "Тип признака определяется его природой, а не способом записи. Числа 1–4 здесь лишь обозначают категории, поэтому среднее значение по этому столбцу лишено клинического смысла."

  - text: "Какой столбец таблицы Heart Failure является целевой переменной (исходом)?"
    lesson: s1-l1
    options:
      - text: "`time` — срок наблюдения"
      - text: "`ejection_fraction` — фракция выброса"
      - text: "`DEATH_EVENT` — смерть за время наблюдения"
        correct: true
      - text: "`serum_creatinine` — креатинин сыворотки"
    explanation: "Целевая переменная — то, что мы хотим объяснить или предсказать. В Heart Failure это `DEATH_EVENT`; остальные столбцы выступают признаками."

  - text: "Что должен содержать словарь данных, который стоит запросить вместе с выгрузкой из медицинской информационной системы?"
    lesson: s1-l1
    options:
      - text: "Смысл каждого столбца"
        correct: true
      - text: "Единицы измерения показателей"
        correct: true
      - text: "Способ кодирования категорий и пропусков"
        correct: true
      - text: "Фамилии пациентов для сверки строк"
    explanation: "Словарь данных описывает столбцы, единицы и кодировки — без него нельзя отличить «холестерин 0» от ошибки. Фамилии пациентов аналитику не нужны и передаваться не должны."

  - text: "Какие из перечисленных сведений относятся к квазиидентификаторам — то есть не называют человека прямо, но в сочетании позволяют его узнать?"
    lesson: s1-l2
    options:
      - text: "Дата рождения"
        correct: true
      - text: "Почтовый индекс"
        correct: true
      - text: "Дата госпитализации"
        correct: true
      - text: "СНИЛС"
    explanation: "СНИЛС — прямой идентификатор: он однозначно указывает на человека сам по себе. Дата рождения, индекс и дата госпитализации безобидны по отдельности, но вместе резко сужают круг возможных людей."

  - text: "Таблица 5-анонимна по возрасту и полу. Что это означает?"
    lesson: s1-l2
    options:
      - text: "В таблице не больше пяти столбцов с личными данными"
      - text: "Каждое сочетание возраста и пола встречается не менее чем у пяти пациентов"
        correct: true
      - text: "Из таблицы удалены пять прямых идентификаторов"
      - text: "Данные зашифрованы пятью ключами"
    explanation: "k-анонимность требует, чтобы каждое сочетание квазиидентификаторов встречалось не реже k раз: любой пациент «прячется» в группе минимум из k похожих."

  - text: "Фамилии в выгрузке заменены случайными кодами, а таблица соответствия «код — пациент» хранится в больнице. Как правильно называть такие данные?"
    lesson: s1-l2
    options:
      - text: "Анонимные: закон о персональных данных на них больше не распространяется"
      - text: "Псевдонимизированные: пока существует ключ, они остаются персональными"
        correct: true
      - text: "Открытые: их можно публиковать в интернете"
      - text: "Обобщённые: точные значения заменены интервалами"
    explanation: "Замена идентификатора кодом — это псевдонимизация. Пока есть ключ, позволяющий вернуться к человеку, данные, как правило, остаются персональными и требуют защиты."

  - text: "Ординатору нужно посчитать статистику по пациентам отделения для доклада. Какой способ действий корректен?"
    lesson: s1-l2
    options:
      - text: "Сфотографировать журнал на телефон и обработать дома"
      - text: "Переслать таблицу с фамилиями себе в мессенджер"
      - text: "Запросить обезличенную выгрузку с нужными столбцами и работать с ней на рабочем компьютере"
        correct: true
      - text: "Загрузить таблицу в публичный чат-бот, чтобы он посчитал средние"
    explanation: "Работать нужно с обезличенной копией и только с теми столбцами, которые требуются для задачи. Личные устройства, мессенджеры и публичные онлайн-сервисы для данных пациентов недопустимы."

  - text: "Команда `hf[\"DEATH_EVENT\"].mean()` вернула 0.321. Что означает это число?"
    lesson: s1-l3
    options:
      - text: "Средний срок наблюдения составил 0,321 года"
      - text: "За время наблюдения умерли 32,1% пациентов"
        correct: true
      - text: "Вероятность ошибки в данных — 32,1%"
      - text: "Умер 321 пациент"
    explanation: "Для столбца из нулей и единиц среднее равно доле единиц. В Heart Failure умерли 96 из 299 пациентов — это 32,1%."

  - text: "Какая запись правильно отбирает пациентов старше 70 лет с фракцией выброса ниже 30%?"
    lesson: s1-l3
    options:
      - text: "`hf[hf[\"age\"] > 70 and hf[\"ejection_fraction\"] < 30]`"
      - text: "`hf[(hf[\"age\"] > 70) & (hf[\"ejection_fraction\"] < 30)]`"
        correct: true
      - text: "`hf[hf[\"age\"] > 70 & hf[\"ejection_fraction\"] < 30]`"
      - text: "`hf[\"age\" > 70, \"ejection_fraction\" < 30]`"
    explanation: "В pandas условия объединяют оператором `&`, а каждое условие берут в скобки. Слово `and` со столбцами не работает, а без скобок `&` выполнится раньше сравнений."

  - text: "Фракция выброса разбита на группы командой `pd.cut(hf[\"ejection_fraction\"], bins=[0, 39, 49, 100])`. В какой интервал попадёт пациент с фракцией выброса 40%?"
    lesson: s1-l3
    options:
      - text: "(0, 39]"
      - text: "(39, 49]"
        correct: true
      - text: "(49, 100]"
      - text: "Ни в какой: значение совпадает с границей"
    explanation: "Интервалы `pd.cut` по умолчанию включают правую границу и не включают левую. Значение 40 больше 39 и не больше 49, поэтому попадает в (39, 49]."

  - text: "У 172 пациентов в столбце `chol` стоит 0. Как правильно поступить с этими значениями?"
    lesson: s1-l5
    options:
      - text: "Оставить: нулевой холестерин — признак здорового пациента"
      - text: "Заменить на настоящий пропуск: ноль обозначал отсутствие измерения"
        correct: true
      - text: "Заменить на 200 мг/дл — верхнюю границу нормы"
      - text: "Удалить столбец `chol` целиком"
    explanation: "Нулевой холестерин физиологически невозможен — так закодировали отсутствие анализа. Скрытый пропуск нужно превратить в настоящий, иначе он исказит среднее и любые расчёты."

  - text: "Нагрузочную пробу не проводят самым тяжёлым пациентам, поэтому показатель `thalach` у них не заполнен. Какой это механизм пропусков?"
    lesson: s1-l5
    options:
      - text: "Полностью случайные пропуски (MCAR)"
      - text: "Неслучайные пропуски (MNAR): вероятность пропуска связана с самим неизвестным значением"
        correct: true
      - text: "Дубликаты"
      - text: "Выбросы"
    explanation: "Если пропуск зависит от того, каким было бы само значение (у тяжёлых пациентов ЧСС на нагрузке была бы ниже), это MNAR. Простая замена таких пропусков средним исказит результат."

  - text: "У одного из пациентов креатинфосфокиназа равна 7861 при медиане 250. Правило 1,5 IQR помечает это значение как выброс. Что делать?"
    lesson: s1-l5
    options:
      - text: "Удалить пациента: выбросы всегда портят анализ"
      - text: "Исправить значение на медиану"
      - text: "Оставить и использовать методы, устойчивые к крайним значениям"
        correct: true
      - text: "Разделить значение на 10 — вероятно, ошиблись с запятой"
    explanation: "Высокая КФК — реальное клиническое состояние, а не ошибка. Удаляют только доказанные ошибки; в остальных случаях применяют медиану, логарифмирование или ранговые методы."

  - text: "Нужно сравнить распределение фракции выброса у выживших и умерших пациентов. Какой график подходит лучше всего?"
    lesson: s1-l6
    options:
      - text: "Круговая диаграмма"
      - text: "Ящик с усами (boxplot) для каждой группы"
        correct: true
      - text: "Диаграмма рассеяния фракции выброса и номера строки"
      - text: "Трёхмерная столбчатая диаграмма"
    explanation: "Ящик с усами показывает медиану, квартили и выбросы количественного показателя в каждой группе и позволяет сразу сравнить их положение и разброс."

  - text: "Что из перечисленного делает график понятнее и честнее?"
    lesson: s1-l6
    options:
      - text: "Подписи осей с единицами измерения"
        correct: true
      - text: "Ось столбчатой диаграммы, начинающаяся с нуля"
        correct: true
      - text: "Две вертикальные оси с разными единицами на одном графике"
      - text: "Одни и те же цвета для одних и тех же групп на всех графиках"
        correct: true
    explanation: "Подписи с единицами, нулевая база у столбцов и постоянные цвета помогают читателю. Две вертикальные оси вводят в заблуждение: соотношение кривых на таком графике зависит от произвольного выбора масштаба."
