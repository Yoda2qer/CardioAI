packages: [pandas, statsmodels, matplotlib]
datasets: [heart_failure.csv]

statement: |
  Сравните выживаемость пациентов с сердечной недостаточностью при сниженной и относительно сохранной фракции выброса — так, как это делают в клинических статьях.

  Таблица загружена, функция `survival_at(km, day)` из урока уже определена.

  1. Разделите пациентов на две группы: `low_ef` — фракция выброса **не выше 30%**, `other_ef` — остальные. Запишите размеры групп в `n_low_ef` и `n_other_ef`, а число смертей в группе со сниженной фракцией — в `events_low_ef`.
  2. Постройте кривые Каплана—Мейера для обеих групп (`SurvfuncRight`). Сохраните:
     - `surv100_low` и `surv100_other` — выживаемость к 100-му дню;
     - `surv250_low` и `surv250_other` — к 250-му дню.
  3. `median_low` — медиана выживаемости в группе со сниженной фракцией выброса (метод `quantile(0.5)`).
  4. `logrank_p` — p-значение лог-рангового теста (`survdiff`) для сравнения групп.
  5. Нарисуйте обе кривые на одном графике с подписями осей и легендой. График не проверяется, но без него вывод не сделать.

  ::: clinic Вопрос для размышления
  Через 250 дней в живых остаётся меньше четверти пациентов со сниженной фракцией выброса. Какие вмешательства могли бы изменить эту кривую — и почему оценить их эффект по таким наблюдательным данным нельзя?
  :::

