packages: [pandas, statsmodels]
datasets: [heart_failure.csv]

statement: |
  Постройте модель Кокса для смертности при сердечной недостаточности и выясните, какие факторы связаны с риском, если учитывать их одновременно.

  Таблица загружена, функция `concordance_index(time, event, risk)` из урока определена, таблица `patients` содержит двух пациентов.

  1. Обучите модель Кокса функцией `smf.phreg` с формулой `formula` (она уже записана) и сохраните результат в `result`. Индикатор события передайте параметром `status`.
  2. Сделайте из коэффициентов Series с названиями признаков: `params = pd.Series(result.params, index=result.model.exog_names)`.
  3. `hr_creatinine` — отношение рисков для креатинина, `ci_creatinine` — список из двух чисел: границы его 95% доверительного интервала (экспонента от `result.conf_int()` в строке креатинина).
  4. `hr_ef_10` — отношение рисков при увеличении фракции выброса на 10 процентных пунктов.
  5. `significant` — список названий признаков с p-значением меньше 0,05 (`result.pvalues`).
  6. `c_index` — C-индекс модели на этих данных. Линейный предиктор для всех пациентов — `result.model.exog @ result.params`.
  7. `relative_risk` — во сколько раз мгновенный риск первого пациента из таблицы `patients` выше, чем второго.

  ::: clinic Что сравнить
  Пол, курение и диабет вошли в модель, но отношения рисков для них близки к единице с широкими интервалами. Означает ли это, что курение безвредно для пациентов с сердечной недостаточностью? Вспомните урок о мультиколлинеарности: как связаны пол и курение в этих данных?
  :::

