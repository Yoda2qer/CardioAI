questions:
  - text: "Пациент наблюдался 60 дней, и на момент окончания наблюдения был жив. Что означает, что его наблюдение цензурировано?"
    lesson: s5-l1
    options:
      - text: "Его данные недостоверны и должны быть удалены"
      - text: "Известно лишь, что событие не наступило в течение 60 дней; что было дальше — неизвестно"
        correct: true
      - text: "Пациент умер на 60-й день"
      - text: "Данные пациента скрыты из соображений конфиденциальности"
    explanation: "Цензурирование справа означает, что наблюдение прекратилось до события. Такой пациент несёт информацию — он прожил не меньше 60 дней, — и методы выживаемости её используют."

  - text: "За время наблюдения умерли 32% пациентов, а по оценке Каплана—Мейера к 250-му дню умирает 42%. Почему простой подсчёт занижает смертность?"
    lesson: s5-l1
    options:
      - text: "Метод Каплана—Мейера всегда завышает смертность"
      - text: "Многие выжившие наблюдались недолго; считая их «пережившими 250 дней», мы не учитываем, что часть из них умерла бы позже"
        correct: true
      - text: "В данных есть дубликаты"
      - text: "Простой подсчёт не учитывает возраст пациентов"
    explanation: "У 55 выживших наблюдение закончилось раньше 100 дней. Простая доля молча считает их выжившими на весь срок, а метод Каплана—Мейера учитывает каждого лишь столько, сколько он наблюдался."

  - text: "Под наблюдением 8 пациентов, оценка выживаемости до этого момента — 0,90. Один из восьми умирает. Какой станет оценка Каплана—Мейера?"
    lesson: s5-l2
    options:
      - text: "0,90 × 7/8 ≈ 0,79"
        correct: true
      - text: "0,90 − 1/8 ≈ 0,78 — вероятности вычитаются"
      - text: "7/8 ≈ 0,88 — прошлые события не учитываются"
      - text: "0,90 — один пациент на оценку не влияет"
    explanation: "Оценка Каплана—Мейера — произведение условных вероятностей пережить каждый момент смерти. Вероятность пережить этот момент равна 7/8, её умножают на предыдущую оценку."

  - text: "В статье написано: «медиана выживаемости не достигнута». Что это значит?"
    lesson: s5-l2
    options:
      - text: "Исследователи забыли её посчитать"
      - text: "За время наблюдения кривая выживаемости не опустилась до 0,5: больше половины пациентов пережили весь период"
        correct: true
      - text: "Все пациенты умерли"
      - text: "Данных недостаточно для построения кривой"
    explanation: "Медиана выживаемости — время, когда кривая пересекает 0,5. Если умерло меньше половины пациентов, она не определена, и это обычная ситуация, а не ошибка."

  - text: "В каком случае лог-ранговый тест может не заметить реального различия выживаемости двух групп?"
    lesson: s5-l2
    options:
      - text: "Когда кривые выживаемости пересекаются"
        correct: true
      - text: "Когда одна кривая всё время ниже другой"
      - text: "Когда в группах больше ста пациентов"
      - text: "Когда событием является не смерть, а госпитализация"
    explanation: "Тест суммирует расхождения наблюдаемых и ожидаемых событий по всему периоду. Если в начале одна группа умирает чаще, а потом реже, расхождения гасят друг друга."

  - text: "В модели Кокса отношение рисков для креатинина равно 1,39 (95% ДИ 1,21–1,60). Как это прочитать?"
    lesson: s5-l4
    options:
      - text: "При повышении креатинина на 1 мг/дл мгновенный риск смерти выше в 1,39 раза при неизменных прочих факторах"
        correct: true
      - text: "39% пациентов с высоким креатинином умерли"
      - text: "Креатинин увеличивает время жизни на 39%"
      - text: "Отношение шансов смерти за весь период равно 1,39"
    explanation: "Отношение рисков сравнивает интенсивность событий в каждый момент времени при увеличении признака на единицу и с учётом остальных факторов модели."

  - text: "Какое допущение лежит в основе модели пропорциональных рисков Кокса?"
    lesson: s5-l4
    options:
      - text: "Время до события распределено нормально"
      - text: "Отношение рисков для каждого фактора постоянно на протяжении всего наблюдения"
        correct: true
      - text: "Цензурированных пациентов нет"
      - text: "Базовый риск одинаков во все моменты времени"
    explanation: "Модель допускает любую форму базового риска, но предполагает, что каждый фактор умножает его на одно и то же число в любой момент. Проверяют это по кривым и остаткам Шёнфельда."

  - text: "C-индекс модели выживаемости равен 0,72. Что это означает?"
    lesson: s5-l4
    options:
      - text: "Модель верно предсказала время смерти в 72% случаев"
      - text: "В 72% сравнимых пар пациентов модель правильно определила, кто из двоих умрёт раньше"
        correct: true
      - text: "72% пациентов пережили период наблюдения"
      - text: "Модель объясняет 72% разброса времени до смерти"
    explanation: "C-индекс — аналог AUC для данных о выживаемости: доля пар, правильно упорядоченных по времени события. 0,5 соответствует случайному угадыванию."

  - text: "Почему для данных с разным сроком наблюдения модель Кокса предпочтительнее логистической регрессии?"
    lesson: s5-l4
    options:
      - text: "Она корректно учитывает цензурированных пациентов"
        correct: true
      - text: "Она использует информацию о том, когда произошло событие"
        correct: true
      - text: "Она не опирается ни на какие допущения"
      - text: "Она всегда даёт более высокий AUC"
    explanation: "Логистическая регрессия смотрит только на факт события и считает выбывшего на 30-й день равным прожившему весь период. Модель Кокса использует время и цензурирование, но и у неё есть допущение — пропорциональность рисков."

  - text: "Модель диагностики ИБС имеет одинаковый AUC у мужчин и женщин (0,86), но при пороге 0,5 находит 86% больных мужчин и лишь 62% больных женщин. Почему?"
    lesson: s5-l6
    options:
      - text: "Модель сломана и должна быть удалена"
      - text: "ИБС в данных у женщин встречается реже, их вероятности в среднем ниже и реже превышают общий порог"
        correct: true
      - text: "Женщин в данных больше, чем мужчин"
      - text: "AUC посчитан с ошибкой"
    explanation: "Модель одинаково хорошо упорядочивает пациентов внутри каждой группы и откалибрована, но при разной распространённости общий порог даёт группам разную чувствительность."

  - text: "Признак «пол» исключили из модели. Чувствительность у мужчин и женщин выровнялась. Что ещё изменилось?"
    lesson: s5-l6
    options:
      - text: "Ничего: проблема решена полностью"
      - text: "Модель стала завышать риск у женщин: ошибка перешла из пропусков в ложные тревоги"
        correct: true
      - text: "AUC вырос до 0,99"
      - text: "Модель перестала работать для мужчин"
    explanation: "Удаление признака не устраняет реального различия в распространённости, а переносит его в другой вид ошибок: средний прогноз у женщин стал заметно выше реальной доли больных."

  - text: "Какие из перечисленных явлений — источники смещения в медицинских моделях?"
    lesson: s5-l6
    options:
      - text: "Отбор пациентов: в данные попадают только направленные на обследование"
        correct: true
      - text: "Разметка: модель учится на зафиксированных диагнозах, а их ставят разным группам с разной частотой"
        correct: true
      - text: "Сдвиг данных: популяция и лечение со временем меняются"
        correct: true
      - text: "Использование перекрёстной проверки вместо одного разбиения"
    explanation: "Смещения возникают при отборе пациентов, постановке диагноза и со временем. Перекрёстная проверка — способ честно оценить модель, а не источник смещения."

  - text: "Какой уровень доказательств отвечает на вопрос «улучшаются ли исходы пациентов, когда врачи пользуются моделью»?"
    lesson: s5-l7
    options:
      - text: "Внутренняя перекрёстная проверка"
      - text: "Внешняя валидация на данных другой клиники"
      - text: "Исследование влияния, в идеале рандомизированное"
        correct: true
      - text: "Высокий AUC на тестовой выборке"
    explanation: "Валидация показывает, что модель умеет различать пациентов. Улучшает ли это исходы, зависит от того, как врачи используют прогноз, и проверяется только исследованием влияния."

  - text: "Врач принял решение, опираясь на прогноз зарегистрированной системы ИИ. Кто отвечает за это решение?"
    lesson: s5-l7
    options:
      - text: "Только разработчик системы"
      - text: "Врач и медицинская организация: модель даёт оценку, решение принимает врач"
        correct: true
      - text: "Никто: решение принято автоматически"
      - text: "Только пациент, если он дал согласие"
    explanation: "Прогноз модели — ещё один результат обследования. Решение и ответственность за него остаются за врачом и организацией, поэтому врачу нужно понимать границы применимости модели."

  - text: "Как в России регулируется программа с искусственным интеллектом, предназначенная для диагностики?"
    lesson: s5-l7
    options:
      - text: "Никак: программы не являются медицинскими изделиями"
      - text: "Как медицинское изделие, подлежащее государственной регистрации в Росздравнадзоре"
        correct: true
      - text: "Достаточно публикации в научном журнале"
      - text: "Регистрируется только в Роспатенте"
    explanation: "Программное обеспечение с ИИ для медицинского применения относится к медицинским изделиям и проходит государственную регистрацию; требования к испытаниям описаны в серии стандартов ГОСТ Р 59921."
